services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: constitution
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d constitution"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/constitution
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-in-production-super-secret-key-0123456789abcdef}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend-react
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata: